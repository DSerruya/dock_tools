apiVersion: v1
kind: ServiceAccount
metadata:
  name: manager-sa
  namespace: dock-tools
---
# Scoped to the dock-tools namespace only — no cluster-wide access, no other namespaces, no
# secrets beyond what manager already reads via its own env/ConfigMap. This is what lets manager
# install/start/stop/update "platform apps" (k8s-deployed apps like utility-tools-hub) from the
# admin UI instead of Diogo running kubectl by hand.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-platform-apps
  namespace: dock-tools
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manager-platform-apps
  namespace: dock-tools
subjects:
  - kind: ServiceAccount
    name: manager-sa
    namespace: dock-tools
roleRef:
  kind: Role
  name: manager-platform-apps
  apiGroup: rbac.authorization.k8s.io
