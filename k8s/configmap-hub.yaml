apiVersion: v1
kind: ConfigMap
metadata:
  name: hub-config
  namespace: dock-tools
data:
  PORT: "3000"
  # Same HOST_SCRIPTS_DATA_PATH/DATA_DIR split as manager-config: this is the path on the k3s
  # NODE that backs the hub-data hostPath volume in deployment-hub.yaml (mounted into the pod
  # at /app/data). The Docker daemon on the other end of docker.sock resolves bind mounts the
  # hub asks it to create (e.g. `${HOME}/.aws` for the onboarding_client sibling container)
  # against NODE paths, not paths inside this pod — so the app needs its own node-real path,
  # not /app/data, to hand to `docker compose run`. Must match hub-data's hostPath.path below.
  AWS_HOME_HOST_DIR: "/opt/dock-tools/utility-tools-hub-data/onboarding/aws-home"
