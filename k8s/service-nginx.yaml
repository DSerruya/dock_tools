apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: dock-tools
spec:
  selector:
    app: nginx
  type: LoadBalancer   # Rancher Desktop (k3s svclb) assigns 192.168.64.2
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080   # also reachable at localhost:30080 via RD port-forward
