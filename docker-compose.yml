services:
  manager:
    build: ./manager
    container_name: script-manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts-data:/app/scripts-data
    environment:
      - NODE_ENV=production
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - HOST_SCRIPTS_DATA_PATH=${HOST_SCRIPTS_DATA_PATH}
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-UTC}
      - DOCKER_NETWORK=script-network
      - PROJECT_REPO=https://github.com/DSerruya/dock_tools.git
      - UI_USERNAME=${UI_USERNAME:-admin}
      - UI_PASSWORD=${UI_PASSWORD}
    restart: unless-stopped
    networks:
      - script-network

  nginx:
    image: nginx:alpine
    container_name: script-nginx
    ports:
      - "${MANAGER_PORT:-8484}:80"
      - "${MANAGER_TLS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - manager
    restart: unless-stopped
    networks:
      - script-network

networks:
  script-network:
    name: script-network
    driver: bridge
