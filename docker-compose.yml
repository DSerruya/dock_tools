services:
  manager:
    build:
      context: ./manager
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: script-manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts-data:/app/scripts-data
    environment:
      - NODE_ENV=production
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - HOST_SCRIPTS_DATA_PATH=${HOST_SCRIPTS_DATA_PATH}
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-UTC}
      - DOCKER_NETWORK=script-network
      - PROJECT_REPO=https://github.com/DSerruya/dock_tools.git
      - UI_USERNAME=${UI_USERNAME:-admin}
      - UI_PASSWORD=${UI_PASSWORD}
    restart: unless-stopped
    networks:
      - script-network

  nginx:
    image: nginx:alpine
    container_name: script-nginx
    ports:
      - "${MANAGER_PORT:-8484}:80"
      - "${MANAGER_TLS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - manager
    restart: unless-stopped
    networks:
      - script-network

  ollama:
    image: ollama/ollama:0.5.13
    container_name: ollama
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - script-network

  health-checker:
    image: alpine:latest
    container_name: health-checker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project
    working_dir: /project
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache docker-cli && crond -f -l 8"]
    restart: unless-stopped
    networks:
      - script-network

networks:
  script-network:
    name: script-network
    driver: bridge

volumes:
  ollama_models:
